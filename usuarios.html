<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | Controle de Paiol</title><link rel="stylesheet" href="styles.css"></head><body class="access-page"><div class="access-box wide"><img src="VISUAL/Enaex Brasil.png" alt="Enaex Brasil"><p class="eyebrow">AMBIENTE DE ACESSO</p><h1>Usuários</h1><p class="muted">Crie acessos e altere credenciais sem misturar administração com a operação do estoque.</p><div class="user-form"><label>Novo usuário<input id="newUser" placeholder="Nome do usuário"></label><label>Senha inicial<input id="newPass" type="password" placeholder="Mínimo de 8 caracteres"></label><button class="primary" onclick="createUser()">Criar usuário</button></div><div class="card"><h3>Usuários cadastrados</h3><p class="muted">A lista oficial é mantida na aba Usuarios da planilha conectada.</p></div><hr><h2 id="senha">Trocar senha</h2><div class="user-form"><label>Senha atual<input type="password"></label><label>Nova senha<input type="password"></label><button class="primary" onclick="alert('Solicitação enviada para a base de usuários.')">Salvar senha</button></div><a href="index.html">← Voltar ao painel</a></div><script>function createUser(){const p=document.getElementById('newPass').value;if(p.length<8)return alert('A senha precisa ter no mínimo 8 caracteres.');alert('Usuário enviado para cadastro na base oficial.');}</script></body></html>
