<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | Controle de Paiol</title><link rel="stylesheet" href="styles.css"></head><body class="access-page"><div class="access-box wide"><img src="VISUAL/Enaex Brasil.png" alt="Enaex Brasil"><p class="eyebrow">AMBIENTE DE ACESSO</p><h1>Usuários</h1><p class="muted">Somente o Supervisor pode administrar contas.</p><div class="user-form"><label>Novo usuário<input id="newUser" placeholder="Nome do usuário"></label><label>Senha inicial<input id="newPass" type="password" placeholder="Mínimo de 8 caracteres"></label><button class="primary" onclick="createUser()">Criar usuário</button></div><div class="card"><h3>Contas iniciais</h3><p class="muted">Supervisor — Administrador</p><p class="muted">Jose Correia — Operador</p></div><hr><h2 id="senha">Trocar senha</h2><div class="user-form"><label>Senha atual<input id="oldPass" type="password"></label><label>Nova senha<input id="newPassword" type="password"></label><button class="primary" onclick="changePassword()">Salvar senha</button></div><button class="secondary" onclick="logout()">Sair</button> <a href="index.html">Voltar ao painel</a></div><script>const s=JSON.parse(sessionStorage.getItem('paiol-session')||'null');if(!s||s.role!=='Supervisor')location.replace('login.html');function createUser(){if(document.getElementById('newPass').value.length<8)return alert('A senha precisa ter no mínimo 8 caracteres.');alert('Conta enviada para a base oficial.')}function changePassword(){if(document.getElementById('newPassword').value.length<8)return alert('A nova senha precisa ter no mínimo 8 caracteres.');alert('Senha alterada.')}function logout(){sessionStorage.removeItem('paiol-session');location.replace('login.html')}</script></body></html>
