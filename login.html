<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Controle de Paiol</title><link rel="stylesheet" href="styles.css"></head><body class="access-page"><div class="access-box"><img src="VISUAL/Enaex Brasil.png" alt="Enaex Brasil"><p class="eyebrow">ACESSO RESTRITO</p><h1>CONTROLE DE PAIOL / EMULSÃO</h1><form id="loginForm"><label>Usuário<input id="user" autocomplete="username" required></label><label>Senha<input id="pass" type="password" autocomplete="current-password" required></label><p id="loginError" class="form-error"></p><button class="primary">Entrar</button></form></div><script>const accounts=[{user:'Supervisor',pass:'Admin',role:'Supervisor',name:'Supervisor'},{user:'jose.correia@enaex.com',pass:'Carlos123',role:'Operador',name:'Jose Carlos Correia Barbosa'}];document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const a=accounts.find(x=>x.user.toLowerCase()===document.getElementById('user').value.trim().toLowerCase()&&x.pass===document.getElementById('pass').value);if(!a)return document.getElementById('loginError').textContent='Usuário ou senha inválidos.';sessionStorage.setItem('paiol-session',JSON.stringify(a));location.replace('index.html')});</script></body></html>
